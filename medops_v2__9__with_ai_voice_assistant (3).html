<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MedOps — Hospital Management System</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf3ea;--sf:#fffdf9;--sf2:#f6ece0;--sf3:#efe0cd;
  --bd:#ecdfc9;--bd2:#ddc7a0;
  --tx:#080f28;--tx2:#3a4468;--tx3:#7c87ab;
  --blue:#2255f4;--blue2:#1540d6;--bluel:#f1f1f7;
  --teal:#059178;--teall:#edf4ef;
  --amber:#c47d09;--amberl:#fcf4e6;
  --red:#d02f2f;--redl:#fceeea;
  --green:#157a40;--greenl:#f0f5ec;
  --violet:#5e35d6;--violetl:#f4eff7;
  --r:8px;--rlg:14px;--rxl:20px;
  --sh:0 1px 4px rgba(60,40,10,.06),0 1px 2px rgba(60,40,10,.04);
  --shm:0 4px 16px rgba(60,40,10,.09),0 2px 6px rgba(60,40,10,.05);
  --shl:0 12px 40px rgba(60,40,10,.13),0 4px 12px rgba(60,40,10,.07);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh}
#root{min-height:100vh}

/* ─── LOGIN ─────────────────────────────────────────────────────── */
.lpage{min-height:100vh;display:flex}
.lside{width:52%;background:#080f28;display:flex;flex-direction:column;justify-content:space-between;padding:52px;position:relative;overflow:hidden}
.lside-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.lside-glow{position:absolute;bottom:-80px;left:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(34,85,244,.18) 0%,transparent 70%);pointer-events:none}
.lside-brand{display:flex;align-items:center;gap:12px;position:relative}
.lside-icon{width:40px;height:40px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.lside-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.3px}
.lside-tag{font-size:11px;color:rgba(255,255,255,.4);font-family:'JetBrains Mono',monospace}
.lside-copy{position:relative}
.lside-hl{font-family:'Fraunces',serif;font-size:44px;font-weight:700;color:#fff;line-height:1.1;letter-spacing:-1.5px;margin-bottom:18px}
.lside-hl em{color:rgba(255,255,255,.35);font-style:italic}
.lside-desc{font-size:15px;color:rgba(255,255,255,.48);line-height:1.75;max-width:340px;margin-bottom:44px}
.lside-pills{display:flex;gap:10px;flex-wrap:wrap}
.lside-pill{padding:7px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;font-size:12px;color:rgba(255,255,255,.55)}
.lside-stats{display:flex;gap:36px;position:relative}
.lstat-n{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:#fff}
.lstat-l{font-size:12px;color:rgba(255,255,255,.38);margin-top:2px}

.lform{flex:1;background:var(--sf);display:flex;flex-direction:column;justify-content:center;padding:52px 56px}
.ltoggle{display:flex;background:var(--sf2);border-radius:var(--r);padding:4px;margin-bottom:34px;gap:4px;border:1px solid var(--bd)}
.ltbtn{flex:1;padding:9px;border-radius:6px;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;color:var(--tx3);background:none}
.ltbtn.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.l-title{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--tx);letter-spacing:-.5px;margin-bottom:5px}
.l-sub{font-size:14px;color:var(--tx3);margin-bottom:30px}
.fgrp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.flbl{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:.02em}
.finp{padding:11px 14px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:14px;color:var(--tx);background:var(--sf);outline:none;font-family:'Plus Jakarta Sans',sans-serif;transition:border-color .15s;width:100%}
.finp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,85,244,.09)}
.fsel{padding:11px 14px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:14px;color:var(--tx);background:var(--sf);outline:none;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbtn{width:100%;padding:13px;border-radius:var(--r);border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:.02em;margin-top:6px}
.lbtn-a{background:var(--blue);color:#fff}
.lbtn-a:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(34,85,244,.3)}
.lbtn-p{background:var(--teal);color:#fff}
.lbtn-p:hover{background:#047661;transform:translateY(-1px);box-shadow:0 4px 16px rgba(5,145,120,.3)}
.hint-box{margin-top:18px;padding:12px 14px;background:var(--sf2);border-radius:var(--r);border:1px solid var(--bd);font-size:12px;color:var(--tx3);line-height:1.8}
.lerr{background:var(--redl);border:1px solid #f5c5c5;color:var(--red);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}

/* ─── SHELL ──────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100vh}
.sidebar{width:224px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-admin{background:#080f28}
.sb-patient{background:#053d31}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logorow{display:flex;align-items:center;gap:10px}
.sb-logoicon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.sb-logoicon-a{background:var(--blue)}
.sb-logoicon-p{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.sb-logoname{font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
.sb-logosub{font-size:10px;color:rgba(255,255,255,.35);font-family:'JetBrains Mono',monospace}
.sb-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.1em;padding:10px 8px 5px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.45);font-size:13px;transition:all .14s;border:none;background:none;width:100%;text-align:left;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.sb-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.78)}
.sb-item.on{color:#fff}
.sb-admin .sb-item.on{background:rgba(34,85,244,.3)}
.sb-patient .sb-item.on{background:rgba(255,255,255,.13)}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-ava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.sb-ava-a{background:var(--blue)}
.sb-ava-p{background:rgba(255,255,255,.2)}
.sb-uname{font-size:13px;color:#fff;font-weight:600}
.sb-urole{font-size:11px;color:rgba(255,255,255,.35)}
.sb-logout{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:7px;border:none;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;width:100%;transition:all .14s;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.sb-logout:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.75)}

/* ─── MAIN ───────────────────────────────────────────────────────── */
.main{flex:1;overflow-y:auto;min-width:0;background:linear-gradient(180deg,#faf3ea 0%,#f6e9db 100%)}
.topbar{background:#fdf7f0;border-bottom:1px solid var(--bd);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:var(--sh)}
.tb-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-date{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.tb-bell{cursor:pointer;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--sf);position:relative;display:flex;align-items:center}
.tb-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--red);border-radius:50%;border:1.5px solid var(--sf)}
.content{padding:22px 24px;display:flex;flex-direction:column;gap:16px}

/* ─── CARDS ──────────────────────────────────────────────────────── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rlg);box-shadow:var(--sh);overflow:hidden}
.card-h{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-t{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.card-b{padding:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ─── STAT CARDS ─────────────────────────────────────────────────── */
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rlg);padding:16px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh)}
.stat-top{display:flex;align-items:flex-start;justify-content:space-between}
.stat-lbl{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-val{font-size:27px;font-weight:700;color:var(--tx);letter-spacing:-1px;font-family:'JetBrains Mono',monospace}
.stat-sub{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:3px}
.c-up{color:var(--green)}.c-dn{color:var(--red)}.c-wn{color:var(--amber)}

/* ─── TABLE ──────────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;text-align:left;background:var(--sf2);border-bottom:1px solid var(--bd)}
td{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:13px;color:var(--tx2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sf2)}

/* ─── BADGES ─────────────────────────────────────────────────────── */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.bg{background:var(--greenl);color:var(--green)}
.ba{background:var(--amberl);color:var(--amber)}
.br{background:var(--redl);color:var(--red)}
.bb{background:var(--bluel);color:var(--blue)}
.bt{background:var(--teall);color:var(--teal)}
.bv{background:var(--violetl);color:var(--violet)}

/* ─── BUTTONS ────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .14s;font-family:'Plus Jakarta Sans',sans-serif}
.bp{background:var(--blue);color:#fff}.bp:hover{background:var(--blue2)}
.bt2{background:var(--teal);color:#fff}.bt2:hover{background:#047661}
.bs{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}.bs:hover{background:var(--sf3)}
.bd2{background:var(--redl);color:var(--red);border:1px solid #f5c5c5}
.sm{padding:5px 10px;font-size:12px}

/* ─── MISC ───────────────────────────────────────────────────────── */
.pbar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}
.alert-s{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:4px}
.a-red{background:var(--redl);border:1px solid #f5c5c5;color:var(--red)}
.a-amb{background:var(--amberl);border:1px solid #fde4a0;color:var(--amber)}
.a-blu{background:var(--bluel);border:1px solid #c5d3fc;color:var(--blue)}
.a-tel{background:var(--teall);border:1px solid #a0dfd4;color:var(--teal)}
.modal-ov{position:fixed;inset:0;background:rgba(8,15,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--sf);border-radius:var(--rxl);padding:28px;width:100%;max-width:500px;box-shadow:var(--shl);animation:mIn .18s ease}
@keyframes mIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-t{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--tx);margin-bottom:20px;letter-spacing:-.3px}
.modal-a{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.qi{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bd)}
.qi:last-child{border-bottom:none}
.qnum{width:32px;height:32px;border-radius:50%;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.deptrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.deptrow:last-child{border-bottom:none}
.dname{font-size:13px;font-weight:600;color:var(--tx);width:125px;flex-shrink:0}
.dpct{font-size:12px;font-family:'JetBrains Mono',monospace;width:38px;text-align:right;flex-shrink:0}
.chartbox{position:relative;height:192px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:13px;z-index:200;box-shadow:var(--shm);display:flex;align-items:center;gap:8px;animation:tUp .18s ease}
@keyframes tUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.tabs-row{display:flex;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .14s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Plus Jakarta Sans',sans-serif}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.ec td{background:rgba(208,47,47,.025)}.ew td{background:rgba(196,125,9,.025)}
/* Patient booking cards */
.doc-card{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--rlg);padding:18px;cursor:pointer;transition:all .18s}
.doc-card:hover{border-color:var(--teal);box-shadow:0 4px 18px rgba(5,145,120,.13);transform:translateY(-2px)}
.doc-card.picked{border-color:var(--teal);background:var(--teall)}
/* Hospital-list cards only: lift + scale + bg tint + animated vertical accent line */
.hosp-card{position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.22,.85,.32,1),box-shadow .28s cubic-bezier(.22,.85,.32,1),background-color .28s ease,border-color .28s ease}
.hosp-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--teal);transform:scaleY(0);transform-origin:top center;transition:transform .32s cubic-bezier(.22,.85,.32,1)}
.hosp-card:hover{transform:translateY(-5px) scale(1.018);box-shadow:0 14px 32px rgba(5,145,120,.18);background-color:var(--teall);border-color:var(--teal)}
.hosp-card:hover::before{transform:scaleY(1)}
.slotbtn{padding:7px 12px;border-radius:7px;border:1.5px solid var(--bd);background:var(--sf);font-size:12px;font-weight:600;cursor:pointer;transition:all .14s;color:var(--tx2);font-family:'JetBrains Mono',monospace}
.slotbtn:hover{border-color:var(--teal);color:var(--teal)}
.slotbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.dava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.step-ind{display:flex;align-items:center;gap:0;margin-bottom:8px}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;transition:all .2s}
.step-line{flex:1;height:2px;transition:background .2s;margin:0 8px}
.step-lbl{font-size:13px;font-weight:600;transition:color .2s}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-in{animation:fadeSlide .24s ease}

/* ─── V2 ADDITIONS ───────────────────────────────────────────────── */
.topbar-tools{display:flex;align-items:center;gap:10px}
.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--sf);font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.lang-menu{position:absolute;top:38px;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shm);z-index:50;min-width:140px;overflow:hidden}
.lang-opt{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--tx2)}
.lang-opt:hover{background:var(--sf2)}
.lang-opt.on{color:var(--teal);font-weight:700;background:var(--teall)}
.offline-bar{background:var(--tx);color:#fff;font-size:12px;font-weight:600;padding:7px 16px;display:flex;align-items:center;gap:8px;justify-content:center}
.offline-bar.warn{background:var(--amber)}
.fab-emg{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(208,47,47,.4);cursor:pointer;z-index:80;border:none;animation:pulseEmg 2s infinite}
@keyframes pulseEmg{0%{box-shadow:0 0 0 0 rgba(208,47,47,.5)}70%{box-shadow:0 0 0 14px rgba(208,47,47,0)}100%{box-shadow:0 0 0 0 rgba(208,47,47,0)}}
.tl{position:relative;padding-left:26px}
.tl-item{position:relative;padding-bottom:22px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1.5px var(--bd2)}
.tl-line{position:absolute;left:-20px;top:16px;bottom:0;width:2px;background:var(--bd)}
.hid-card{background:linear-gradient(135deg,#080f28,#132152);border-radius:var(--rxl);padding:24px;color:#fff;position:relative;overflow:hidden}
.hid-card::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.hid-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.hid-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:.06em;margin-top:14px;position:relative}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;gap:5px;background:var(--sf2);color:var(--tx2)}
.refchain{display:flex;align-items:flex-start;flex-wrap:wrap;gap:0}
.refnode{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.refdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.refline{flex:1;height:2px;min-width:24px;margin:14px -2px 0}
.qr-mock{width:132px;height:132px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px;margin:0 auto}

let _voiceCache=[];
if(typeof window!=='undefined'&&'speechSynthesis' in window){
  const refresh=()=>{_voiceCache=window.speechSynthesis.getVoices()||[];};
  refresh();
  window.speechSynthesis.onvoiceschanged=refresh;
}
function pickVoice(lang){
  const full=TTS_LANG_MAP[lang]||'en-IN';
  const prefix=full.split('-')[0].toLowerCase();
  if(!_voiceCache.length&&'speechSynthesis' in window)_voiceCache=window.speechSynthesis.getVoices()||[];
  const exact=_voiceCache.find(v=>v.lang&&v.lang.toLowerCase()===full.toLowerCase());
  if(exact)return{voice:exact,matched:true};
  const sameBase=_voiceCache.find(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));
  if(sameBase)return{voice:sameBase,matched:true};
  return{voice:null,matched:false};
}
// Speaks `text` in `lang`, picking the closest installed voice on THIS device.
// Returns {ok, matched} — matched=false means no voice for that language was
// found on this device (a real, common limitation of the browser Speech API,
// not a translation problem — the text itself is always correct).
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)||!text)return{ok:false,matched:false};
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const {voice,matched}=pickVoice(lang);
    if(voice){u.voice=voice;u.lang=voice.lang;}
    else{u.lang=TTS_LANG_MAP[lang]||'en-IN';}
    u.rate=0.95;
    window.speechSynthesis.speak(u);
    return{ok:true,matched};
  }catch(e){return{ok:false,matched:false};}
}
function matchFaq(query,lang){
  const q=(query||'').toLowerCase();
  if(!q)return null;
  let best=null,bestScore=0;
  ASSISTANT_FAQ.forEach(f=>{
    const kws=f.keywords[lang]||f.keywords.en;
    let score=0;
    kws.forEach(k=>{if(q.includes(k.toLowerCase()))score++;});
    if(score>bestScore){bestScore=score;best=f;}
  });
  return bestScore>0?best:null;
}

function scheduleStatus(item){
  if(item.done)return{label:'Done',cls:'bg'};
  if(new Date(item.date)<now)return{label:'Overdue',cls:'br'};
  return{label:'Upcoming',cls:'ba'};
}
function scheduleAdherence(entries){
  const items=entries.flatMap(e=>e.schedule);
  const total=items.length;
  const onTrack=items.filter(i=>i.done||new Date(i.date)>=now).length;
  return total?Math.round(onTrack/total*100):100;
}

// ── Deterministic pseudo-random helper (keeps demo numbers stable across renders) ──
function seededNum(str,mod){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h%mod;}
function genTxnId(){return 'TXN-'+Math.random().toString(36).slice(2,10).toUpperCase();}

function hospDistance(h){return +(seededNum(h.name,140)/10+1.2).toFixed(1);}

// ── Diagnostic/scan availability across nearby hospitals (mock, deterministic) —
// mirrors medicine availability so patients don't travel to a hospital that
// can't actually run the test they need.
function nearbyDiagnostics(testName){
  const matches=CHENNAI_HOSPITALS.filter(h=>h.scans.some(s=>{
    const base=s.split('(')[0].trim().toLowerCase();
    return base.includes(testName.toLowerCase())||testName.toLowerCase().includes(base);
  }));
  const pool=matches.length?matches:CHENNAI_HOSPITALS.slice(0,4);
  return pool.map(h=>({
    hospital:h,
    turnaround:1+seededNum(h.id+testName+'t',3),
    price:300+seededNum(h.id+testName+'p',20)*50,
    dist:hospDistance(h),
  })).sort((a,b)=>a.dist-b.dist);
}

const QUEUE_NAME_POOL=['Anand Krishnan','Divya Murugan','Sanjay Gupta','Kavitha Rajan','Babu Reddy','Meera Nair','Suresh Babu','Lakshmi Iyer','Ramesh Kumar','Anita Rao','Vignesh S','Priya Menon','Karthik R','Deepa S','Manoj Kumar','Fathima Beevi'];
// Per-doctor waiting list — every doctor at every hospital gets their own queue.
function doctorQueue(h,doc){
  const n=2+seededNum(h.id+doc.id+'qc',4); // 2-5 people waiting
  return Array.from({length:n}).map((_,i)=>{
    const nameIdx=seededNum(h.id+doc.id+'q'+i,QUEUE_NAME_POOL.length);
    const waitBase=5+seededNum(h.id+doc.id+'w'+i,15)+i*10;
    return {n:i+1,name:QUEUE_NAME_POOL[nameIdx],wait:`~${waitBase} min`};
  });
}
// Hospital-wide OPD snapshot — one row per doctor with their live queue length.
function hospitalOPDByDoctor(h){
  return (h.doctors||[]).map(doc=>({doc,queue:doctorQueue(h,doc)}));
}
function hospitalOccupancy(h){
  return h.departments.map(d=>({name:d.name,pct:38+seededNum(h.id+d.name,55)}));
}
// "Fastest option near you" — combines travel distance with current queue
// length so patients spend less time travelling AND less time waiting.
function fastestHospitalScore(h){
  const totalWaiting=hospitalOPDByDoctor(h).reduce((a,r)=>a+r.queue.length,0);
  const avgQueue=totalWaiting/(h.doctors.length||1);
  return hospDistance(h)+avgQueue*0.8;
}
function fastestHospital(){
  return [...CHENNAI_HOSPITALS].sort((a,b)=>fastestHospitalScore(a)-fastestHospitalScore(b))[0];
}

function translitDoctorName(name){
  const body=name.replace(/^Dr\.\s*/,'');
  const tokens=body.split(' ').filter(Boolean);
  const parts={hi:[],mr:[],ta:[],te:[]};
  LI.forEach(l=>parts[l].push(NAME_TITLE[l]));
  tokens.forEach(tok=>{
    const clean=tok.replace(/\.$/,'');
    const isInitial=/^[A-Za-z]$/.test(clean);
    const row=NAME_TR[clean];
    LI.forEach((l,i)=>{
      let piece=row?row[i]:tok;
      if(isInitial&&row)piece+='.';
      parts[l].push(piece);
    });
  });
  return {hi:parts.hi.join(' '),mr:parts.mr.join(' '),ta:parts.ta.join(' '),te:parts.te.join(' ')};
}

// ── Per-hospital doctor rosters (derived from each hospital's own department
// listing, so every hospital gets its own distinct doctors and doctor count) ──
const EXP_POOL=['5 yrs','6 yrs','8 yrs','10 yrs','12 yrs','14 yrs','16 yrs','18 yrs','20 yrs','22 yrs','25 yrs'];
const SLOT_POOL=['08:30 AM','09:00 AM','09:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','02:00 PM','02:30 PM','03:00 PM','03:30 PM','04:00 PM','04:30 PM','05:00 PM'];
function buildDoctor(hid,idx,name,dept,subspec,clr){
  const seedBase=hid+name;
  const exp=EXP_POOL[seededNum(seedBase+'e',EXP_POOL.length)];
  const rating=+(4.5+seededNum(seedBase+'r',5)/10).toFixed(1);
  const fee=300+seededNum(seedBase+'f',9)*50;
  const slotCount=2+seededNum(seedBase+'sc',3);
  const slots=[];
  for(let i=0;i<slotCount;i++){
    const s=SLOT_POOL[seededNum(seedBase+'s'+i,SLOT_POOL.length)];
    if(!slots.includes(s))slots.push(s);
  }
  if(slots.length===0)slots.push(SLOT_POOL[0]);
  return {id:`${hid}-D${idx+1}`,name,nameLoc:translitDoctorName(name),dept,qual:subspec,exp,rating,fee,slots,clr};
}
function buildHospitalDoctors(h){
  let idx=0;
  const list=[];
  h.departments.forEach(d=>{
    d.doctors.forEach(docStr=>{
      const parts=docStr.split('–');
      const name=parts[0].trim();
      const subspec=(parts[1]||d.name).trim();
      list.push(buildDoctor(h.id,idx++,name,d.name,subspec,h.clr));
    });
  });
  return list;
}

const LangCtx=createContext({lang:'en',setLang:()=>{},t:k=>k});
function useLang(){return useContext(LangCtx);}
function LangProvider({children}){
  const [lang,setLang]=useState('en');
  const t=k=>(STRINGS[lang]&&STRINGS[lang][k])||STRINGS.en[k]||k;
  return <LangCtx.Provider value={{lang,setLang,t}}>{children}</LangCtx.Provider>;
}
function LangSwitch(){
  const {lang,setLang}=useLang();
  const [open,setOpen]=useState(false);
  return(
    <div className="lang-wrap">
      <button className="lang-btn" onClick={()=>setOpen(o=>!o)}><Icon n="globe" s={13}/>{LANGS.find(l=>l.code===lang)?.label}</button>
      {open&&(
        <div className="lang-menu" onMouseLeave={()=>setOpen(false)}>
          {LANGS.map(l=><div key={l.code} className={`lang-opt ${lang===l.code?'on':''}`} onClick={()=>{setLang(l.code);setOpen(false);}}>{l.label}</div>)}
        </div>
      )}
    </div>
  );
}

function useOnline(){
  const [online,setOnline]=useState(navigator.onLine);
  useEffect(()=>{
    const on=()=>setOnline(true),off=()=>setOnline(false);
    window.addEventListener('online',on);window.addEventListener('offline',off);
    return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[]);
  return online;
}
function OfflineBanner(){
  const online=useOnline();
  const {t}=useLang();
  const [showSync,setShowSync]=useState(false);
  const prevOnline=useRef(online);
  useEffect(()=>{
    if(!prevOnline.current&&online){setShowSync(true);const tm=setTimeout(()=>setShowSync(false),3000);return()=>clearTimeout(tm);}
    prevOnline.current=online;
  },[online]);
  if(online&&!showSync)return null;
  return <div className={`offline-bar ${online?'':'warn'}`}><Icon n={online?'check':'wifiOff'} s={13}/>{online?t('online'):t('offline')}</div>;
}

function EmergencyModal({onClose}){
  const {lang,t}=useLang();
  const [requested,setRequested]=useState(false);
  const nearest=[...CHENNAI_HOSPITALS].sort((a,b)=>seededNum(a.name,140)-seededNum(b.name,140)).slice(0,3);
  return(
    <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        <div className="modal-t" style={{color:'var(--red)'}}>🚨 {t('emergency')}</div>
        {!requested?(
          <>
            <div className="alert-s a-red" style={{marginBottom:14}}><Icon n="warn" s={13}/>If this is life-threatening, call 108 (India Emergency Ambulance) immediately.</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
              <button className="btn bd2" style={{justifyContent:'center',padding:'14px'}} onClick={()=>setRequested(true)}><Icon n="siren" s={14}/>Request Ambulance</button>
              <a className="btn bs" style={{justifyContent:'center',padding:'14px',textDecoration:'none'}} href="tel:108"><Icon n="phone" s={14}/>Call 108</a>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:'var(--tx2)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.04em'}}>Nearest hospitals</div>
            {nearest.map(h=>(
              <div key={h.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--bd)'}}>
                <div><div style={{fontWeight:600,fontSize:13}}>{hName(h,lang)}</div><div style={{fontSize:11,color:'var(--tx3)'}}>{hLoc(h,lang)}</div></div>
                <span className="bdg bb">{(seededNum(h.name,140)/10+1.2).toFixed(1)} km</span>
              </div>
            ))}
          </>
        ):(
          <div style={{textAlign:'center',padding:'12px 0'}}>
            <div style={{fontSize:40,marginBottom:10}}>🚑</div>
            <div style={{fontFamily:'Fraunces,serif',fontWeight:700,fontSize:17,marginBottom:6}}>Ambulance requested</div>
            <div style={{fontSize:13,color:'var(--tx3)'}}>Nearest available ambulance has been alerted. Estimated arrival: 8–12 minutes.<br/>The emergency doctor on duty has been notified.</div>
          </div>
        )}
        <div className="modal-a"><button className="btn bs" onClick={onClose}>{t('close')}</button></div>
      </div>
    </div>
  );
}
function EmergencyFab(){
  const [open,setOpen]=useState(false);
  return(<>
    <button className="fab-emg" onClick={()=>setOpen(true)} title="Emergency"><Icon n="siren" s={22}/></button>
    {open&&<EmergencyModal onClose={()=>setOpen(false)}/>}

}

function LoginPage({onLogin}){
  const {t}=useLang();
  const [mode,setMode]=useState('patient');
  const [em,setEm]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [isReg,setIsReg]=useState(false);
  const [reg,setReg]=useState({name:'',email:'',pw:'',age:'',phone:''});

  const doLogin=()=>{
    setErr('');
    if(mode==='admin'){
      if(em===USERS.admin.email&&pw===USERS.admin.pw){onLogin('admin',USERS.admin);return;}
      setErr('Wrong credentials — try admin@medops.in / admin123');
    } else {
      const p=USERS.patients.find(x=>x.email===em&&x.pw===pw);
      if(p){onLogin('patient',p);return;}
      setErr('Wrong credentials — try raj@gmail.com / pass123');
    }
  };

  const doReg=()=>{
    if(!reg.name||!reg.email||!reg.pw){setErr('Name, email and password are required');return;}
    const np={email:reg.email,pw:reg.pw,name:reg.name,age:+reg.age||0,pid:'P-'+(2000+Math.floor(Math.random()*7999)),phone:reg.phone,healthId:'MHID-2026-'+(1000+Math.floor(Math.random()*8999)),bloodGroup:'—',allergies:[],chronic:[]};
    USERS.patients.push(np);
    setIsReg(false);setEm(reg.email);setPw(reg.pw);setErr('');
    setReg({name:'',email:'',pw:'',age:'',phone:''});
  };

  return(
    <div className="lpage">
      <div className="lside">
        <div className="lside-dots"/><div className="lside-glow"/>
        <div className="lside-brand">
          <div className="lside-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L12 22M2 12h20" stroke="white" strokeWidth="2.5" strokeLinecap="round"/><circle cx="12" cy="12" r="5" stroke="white" strokeWidth="2"/></svg></div>
          <div><div className="lside-name">MedOps</div><div className="lside-tag">{t('loginTag')}</div></div>
        </div>
        <div className="lside-copy">
          <div className="lside-hl">{t('loginHlLine1')}<br/><em>{t('loginHlLine2')}</em><br/>{t('loginHlLine3')}</div>
          <div className="lside-desc">{t('loginDesc')}</div>
          <div className="lside-pills">
            <span className="lside-pill">{t('pillHospitals')}</span>
            <span className="lside-pill">{t('pillQueues')}</span>
            <span className="lside-pill">{t('pillBook')}</span>
            <span className="lside-pill">{t('pillLanguage')}</span>
          </div>
        </div>
        <div className="lside-stats">
          <div><div className="lstat-n">5</div><div className="lstat-l">{t('statLanguages')}</div></div>
          <div><div className="lstat-n">24×7</div><div className="lstat-l">{t('statEmergency')}</div></div>
          <div><div className="lstat-n">₹0</div><div className="lstat-l">{t('statFree')}</div></div>
        </div>
      </div>

      <div className="lform">
        <div className="ltoggle">
          {['patient','admin'].map(m=>(
            <button key={m} className={`ltbtn ${mode===m?'on':''}`} onClick={()=>{setMode(m);setErr('');setIsReg(false)}}>
              {m==='admin'?'Admin Login':t('patientLoginTab')}
            </button>
          ))}
        </div>

        {!isReg ? (
          <>
            <div className="l-title">{mode==='admin'?'Admin Portal':t('patientPortalTitle')}</div>

}

function AdminDash({inv,invoices,patients,appts,goTo}){
  const chartRef=useRef(null);const chartInst=useRef(null);
  const critExp=inv.filter(i=>daysLeft(i.exp)<=7);
  const totalOcc=DEPTS.reduce((a,b)=>a+b.occ,0);
  const totalBeds=DEPTS.reduce((a,b)=>a+b.beds,0);
  const pendRec=invoices.filter(i=>i.type==='receivable'&&i.status==='pending').reduce((a,b)=>a+b.amt,0);

  useEffect(()=>{
    if(!chartRef.current)return;
    if(chartInst.current)chartInst.current.destroy();
    chartInst.current=new Chart(chartRef.current,{
      type:'bar',
      data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[
          {label:'OPD',data:[42,55,38,60,48,35,28],backgroundColor:'rgba(34,85,244,.13)',borderColor:'rgba(34,85,244,.65)',borderWidth:1.5,borderRadius:5},
          {label:'Admitted',data:[18,22,20,25,19,14,12],backgroundColor:'rgba(5,145,120,.1)',borderColor:'rgba(5,145,120,.65)',borderWidth:1.5,borderRadius:5},
        ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:'Plus Jakarta Sans',size:11},boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{font:{family:'JetBrains Mono',size:10}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:'JetBrains Mono',size:10}}}}}
    });
    return()=>chartInst.current?.destroy();
  },[]);

  return(
    <div className="content">
      {critExp.slice(0,2).map(i=>(
        <div key={i.id} className="alert-s a-red"><Icon n="warn" s={13}/><strong>{i.name}</strong> expires in {daysLeft(i.exp)} day(s) — {i.qty} {i.unit} left.<button className="btn bd2 sm" style={{marginLeft:'auto'}} onClick={()=>goTo('alerts')}>Review</button></div>
      ))}
      <div className="g4">
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Active patients</span><div className="stat-ico" style={{background:'var(--bluel)'}}><Icon n="user" s={14}/></div></div><div className="stat-val">{patients.filter(p=>p.status!=='discharge').length}</div><div className="stat-sub c-up"><Icon n="up" s={11}/>+4 today</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Bed occupancy</span><div className="stat-ico" style={{background:'var(--teall)'}}><Icon n="hospital" s={14}/></div></div><div className="stat-val">{Math.round(totalOcc/totalBeds*100)}%</div><div className="stat-sub c-wn">{totalOcc}/{totalBeds} beds</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Pending receivable</span><div className="stat-ico" style={{background:'var(--greenl)'}}><Icon n="receipt" s={14}/></div></div><div className="stat-val" style={{fontSize:18}}>₹{fmtNum(pendRec)}</div><div className="stat-sub c-up">3 invoices</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Today's appts</span><div className="stat-ico" style={{background:'var(--violetl)'}}><Icon n="cal" s={14}/></div></div><div className="stat-val">{appts.length}</div><div className="stat-sub c-up">{appts.filter(a=>a.status==='pending').length} pending</div></div>
      </div>
      <div className="g4">
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Referral success</span><div className="stat-ico" style={{background:'var(--violetl)'}}><Icon n="share2" s={14}/></div></div><div className="stat-val">{Math.round(REFERRALS.filter(r=>r.stage>=r.chain.length-1).length/REFERRALS.length*100)||0}%</div><div className="stat-sub">{REFERRALS.length} referrals</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Teleconsultations</span><div className="stat-ico" style={{background:'var(--bluel)'}}><Icon n="video" s={14}/></div></div><div className="stat-val">{TELECONSULTS.length}</div><div className="stat-sub c-up">This week</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">High-risk patients</span><div className="stat-ico" style={{background:'var(--redl)'}}><Icon n="pulse" s={14}/></div></div><div className="stat-val">{HIGH_RISK.length}</div><div className="stat-sub c-wn">Active monitoring</div></div>
        <div className="stat"><div className="stat-top"><span className="stat-lbl">Medicine availability</span><div className="stat-ico" style={{background:'var(--greenl)'}}><Icon n="pill" s={14}/></div></div><div className="stat-val">{Math.round(inv.filter(i=>i.qty>i.ro).length/inv.length*100)}%</div><div className="stat-sub">{inv.filter(i=>i.qty<=i.ro).length} low stock</div></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-h"><span className="card-t">Weekly patient inflow</span></div><div className="card-b"><div className="chartbox"><canvas ref={chartRef}/></div></div></div>
        <div className="card"><div className="card-h"><span className="card-t">Live OPD queue</span><span className="bdg bg">Open</span></div><div className="card-b" style={{padding:'8px 14px'}}>
          {OPD_QUEUE.map(q=>(
            <div key={q.n} className="qi">
              <div className="qnum" style={{background:'var(--bluel)',color:'var(--blue)'}}>{q.n}</div>
              <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13}}>{q.name}</div><div style={{fontSize:12,color:'var(--tx3)'}}>{q.dept}</div></div>
              <div style={{fontSize:11,color:'var(--tx3)',fontFamily:'JetBrains Mono'}}>{q.wait}</div>
            </div>
          ))}
        </div></div>
      </div>
      <div className="g2">
        <div className="card"><div className="card-h"><span className="card-t">Department occupancy</span></div><div className="card-b">
          {DEPTS.map(d=>{const p=Math.round(d.occ/d.beds*100);return(
            <div key={d.name} className="deptrow">
              <div className="dname">{d.name}</div>
              <div style={{flex:1}}><div className="pbar"><div className="pfill" style={{width:p+'%',background:d.clr}}/></div></div>
              <div className="dpct" style={{color:p>=90?'var(--red)':p>=70?'var(--amber)':'var(--teal)'}}>{p}%</div>
            </div>
          );})}
        </div></div>
        <div className="card"><div className="card-h"><span className="card-t">Recent invoices</span><button className="btn bs sm" onClick={()=>goTo('apar')}>All</button></div><div className="tw">
          <table><thead><tr><th>ID</th><th>Party</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody>{invoices.slice(0,5).map(v=>(
            <tr key={v.id}><td style={{fontFamily:'JetBrains Mono',fontSize:11}}>{v.id}</td><td>{v.party}</td><td style={{fontFamily:'JetBrains Mono'}}>₹{fmtNum(v.amt)}</td><td><span className={`bdg ${v.status==='paid'?'bg':v.status==='pending'?'ba':'br'}`}>{v.status}</span></td></tr>
          ))}</tbody></table>
        </div></div>
      </div>
    </div>
  );
}

function AdminAppointments({appts,setAppts,toast}){
  const confirm=id=>{setAppts(p=>p.map(a=>a.id===id?{...a,status:'confirmed'}:a));toast('Appointment confirmed — patient notified');};
  const cancel=id=>{setAppts(p=>p.map(a=>a.id===id?{...a,status:'cancelled'}:a));toast('Appointment cancelled');};
  return(
    <div className="content">
      <div className="g4">
        {[['Total',appts.length,'bluel','cal'],['Confirmed',appts.filter(a=>a.status==='confirmed').length,'greenl','check'],['Pending',appts.filter(a=>a.status==='pending').length,'amberl','warn'],['Cancelled',appts.filter(a=>a.status==='cancelled').length,'redl','warn']].map(([l,v,bg,ic])=>(
          <div key={l} className="stat"><div className="stat-top"><span className="stat-lbl">{l}</span><div className="stat-ico" style={{background:`var(--${bg})`}}><Icon n={ic} s={14}/></div></div><div className="stat-val">{v}</div></div>
        ))}
      </div>
      <div className="card"><div className="card-h"><span className="card-t">All appointments</span></div><div className="tw">
        <table><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Date</th><th>Slot</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>{appts.map(a=>(
          <tr key={a.id}>
            <td style={{fontFamily:'JetBrains Mono',fontSize:11}}>{a.id}</td>
            <td style={{fontWeight:600}}>{a.patName}</td>
            <td>{a.doctor}</td><td>{a.dept}</td>
            <td style={{fontFamily:'JetBrains Mono',fontSize:11}}>{fmtDate(a.date)}</td>
            <td style={{fontFamily:'JetBrains Mono',fontSize:11}}>{a.slot}</td>
            <td style={{color:'var(--tx3)',fontSize:12,maxWidth:140}}>{a.reason}</td>
            <td><span className={`bdg ${a.status==='confirmed'?'bg':a.status==='pending'?'ba':'br'}`}>{a.status}</span></td>
            <td><div style={{display:'flex',gap:5}}>
              {a.status==='pending'&&<><button className="btn bt2 sm" onClick={()=>confirm(a.id)}>Confirm</button><button className="btn bd2 sm" onClick={()=>cancel(a.id)}>Cancel</button></>}
            </div></td>
          </tr>
        ))}</tbody></table>
      </div></div>
    </div>
  );
}

function AdminInventory({inv,setInv,toast}){
  const [filter,setFilter]=useState('all');
  const [showM,setShowM]=useState(false);
  const [fm,setFm]=useState({name:'',cat:'',dept:'',qty:'',unit:'',ro:'',exp:'',vendor:'',cost:''});
  const list=inv.filter(i=>filter==='all'?true:filter==='crit'?daysLeft(i.exp)<=7:filter==='exp30'?daysLeft(i.exp)<=30:i.qty<=i.ro);
  const addItem=()=>{
    if(!fm.name||!fm.qty)return;
    setInv(p=>[...p,{...fm,id:Date.now(),qty:+fm.qty,ro:+fm.ro,cost:+fm.cost}]);
    setFm({name:'',cat:'',dept:'',qty:'',unit:'',ro:'',exp:'',vendor:'',cost:''});
    setShowM(false);toast('Item added to inventory');
  };
  return(
    <div className="content">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
        <div style={{display:'flex',gap:7}}>
          {[['all','All items'],['crit','Critical ≤7d'],['exp30','Expiring ≤30d'],['low','Low stock']].map(([k,l])=>(
            <button key={k} className={`btn sm ${filter===k?'bp':'bs'}`} onClick={()=>setFilter(k)}>{l}</button>
          ))}
        </div>
        <button className="btn bp" onClick={()=>setShowM(true)}><Icon n="plus" s={13}/>Add item</button>
      </div>
      <div className="card"><div className="card-h"><span className="card-t">Inventory — {list.length} items</span></div><div className="tw">
        <table><thead><tr><th>Item</th><th>Dept</th><th>Stock</th><th>Reorder at</th><th>Expiry</th><th>Status</th><th>Vendor</th><th>Cost</th><th></th></tr></thead>
        <tbody>{list.map(item=>{
          const d=daysLeft(item.exp);
          return(
            <tr key={item.id} className={d<=7?'ec':d<=30?'ew':''}>
              <td><div style={{fontWeight:600,color:'var(--tx)'}}>{item.name}</div><div style={{fontSize:11,color:'var(--tx3)'}}>{item.cat}</div></td>
              <td>{item.dept}</td>
              <td style={{fontFamily:'JetBrains Mono'}}>{item.qty} {item.unit}{item.qty<=item.ro&&<span className="bdg ba" style={{marginLeft:7}}>Low</span>}</td>
              <td style={{fontFamily:'JetBrains Mono',color:'var(--tx3)'}}>{item.ro}</td>
              <td style={{fontFamily:'JetBrains Mono',fontSize:11}}>{fmtDate(item.exp)}</td>
              <td>{d<=7?<span className="bdg br">{d}d left</span>:d<=30?<span className="bdg ba">{d}d left</span>:<span className="bdg bg">OK</span>}</td>
              <td style={{fontSize:12,color:'var(--tx3)'}}>{item.vendor}</td>
              <td style={{fontFamily:'JetBrains Mono'}}>₹{item.cost}</td>
              <td><button className="btn bs sm" onClick={()=>toast(`PO raised for ${item.name}`)}>Reorder</button></td>
            </tr>
          );})}
        </tbody></table>
      </div></div>
      {showM&&(
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
          <div className="modal">
            <div className="modal-t">Add inventory item</div>
            <div className="f2">
              <div className="fgrp"><label className="flbl">Item name *</label><input className="finp" value={fm.name} onChange={e=>setFm({...fm,name:e.target.value})} placeholder="e.g. Paracetamol"/></div>
              <div className="fgrp"><label className="flbl">Category</label><input className="finp" value={fm.cat} onChange={e=>setFm({...fm,cat:e.target.value})} placeholder="Analgesic"/></div>
            </div>
            <div className="f2">
              <div className="fgrp"><label className="flbl">Department</label><input className="finp" value={fm.dept} onChange={e=>setFm({...fm,dept:e.target.value})} placeholder="Pharmacy"/></div>
              <div className="fgrp"><label className="flbl">Vendor</label><input className="finp" value={fm.vendor} onChange={e=>setFm({...fm,vendor:e.target.value})} placeholder="Vendor name"/></div>
            </div>
            <div className="f2">
              <div className="fgrp"><label className="flbl">Quantity *</label><input className="finp" type="number" value={fm.qty} onChange={e=>setFm({...fm,qty:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Unit</label><input className="finp" value={fm.unit} onChange={e=>setFm({...fm,unit:e.target.value})} placeholder="Strips"/></div>
            </div>
            <div className="f2">
              <div className="fgrp"><label className="flbl">Reorder at</label><input className="finp" type="number" value={fm.ro} onChange={e=>setFm({...fm,ro:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Unit cost ₹</label><input className="finp" type="number" value={fm.cost} onChange={e=>setFm({...fm,cost:e.target.value})}/></div>
            </div>
            <div className="fgrp"><label className="flbl">Expiry date</label><input className="finp" type="date" value={fm.exp} onChange={e=>setFm({...fm,exp:e.target.value})}/></div>
            <div className="modal-a"><button className="btn bs" onClick={()=>setShowM(false)}>Cancel</button><button className="btn bp" onClick={addItem}>Add item</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminAPAR({invoices,setInvoices,toast}){
  const [tab,setTab]=useState('all');
  const [showM,setShowM]=useState(false);
  const [fm,setFm]=useState({party:'',dept:'',amt:'',type:'receivable',date:''});
  const list=invoices.filter(i=>tab==='all'?true:i.type===tab);
  const tR=invoices.filter(i=>i.type==='receivable').reduce((a,b)=>a+b.amt,0);
  const tP=invoices.filter(i=>i.type==='payable').reduce((a,b)=>a+b.amt,0);
  const addInv=()=>{
    if(!fm.party||!fm.amt)return;
    setInvoices(p=>[...p,{id:'INV-'+(100+p.length+1),...fm,amt:+fm.amt,status:'pending',date:fm.date||now.toISOString().split('T')[0]}]);
    setShowM(false);toast('Invoice created');
  };
  return(

// Aggregate average OPD wait time across every doctor at every hospital.
function avgWaitMinutes(){
  const mins=[];
  CHENNAI_HOSPITALS.forEach(h=>{
    hospitalOPDByDoctor(h).forEach(({queue})=>{
      queue.forEach(q=>{
        const m=parseInt(q.wait.replace(/[^0-9]/g,''),10);
        if(!isNaN(m))mins.push(m);
      });
    });
  });
  return mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):0;
}

// ADMIN · DOCTOR VOICE INSTRUCTIONS  (new — does not alter any existing page)
// ════════════════════════════════════════════════════════════════════════════
function AdminVoiceCare({patients,voiceNotes,setVoiceNotes,toast}){
  const {lang,t}=useLang();
  const [showM,setShowM]=useState(false);
  const [pid,setPid]=useState(patients[0]?.id||'');
  const [msgLang,setMsgLang]=useState('en');
  const [text,setText]=useState('');
  const [rec,setRec]=useState(null); // {url, blob}
  const [recording,setRecording]=useState(false);
  const mediaRef=useRef(null);
  const chunksRef=useRef([]);
  const [when,setWhen]=useState('');
  const [voiceWarn,setVoiceWarn]=useState(null); // note id with no matching voice on this device

  const patient=patients.find(p=>p.id===pid);
  useEffect(()=>{
    if(patient&&patient.preferredLang)setMsgLang(patient.preferredLang);
  },[pid]); // eslint-disable-line

  const startRec=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream);
      chunksRef.current=[];
      mr.ondataavailable=e=>chunksRef.current.push(e.data);
      mr.onstop=()=>{
        const blob=new Blob(chunksRef.current,{type:'audio/webm'});
        setRec({url:URL.createObjectURL(blob)});
        stream.getTracks().forEach(tr=>tr.stop());
      };
      mediaRef.current=mr;
      mr.start();
      setRecording(true);
    }catch(e){toast('Microphone not available');}
  };
  const stopRec=()=>{mediaRef.current&&mediaRef.current.stop();setRecording(false);};

  const reset=()=>{setText('');setRec(null);setWhen('');setMsgLang('en');};

  const submit=(sendNow)=>{
    if(!patient||!text.trim())return;
    const note={
      id:nextVoiceNoteId(),pid:patient.id,patName:patient.name,doctor:patient.doctor,
      lang:msgLang,text:text.trim(),audio:rec?.url||null,
      scheduledAt:sendNow?new Date():(when?new Date(when):new Date()),
      status:'scheduled',createdAt:new Date()
    };
    setVoiceNotes(p=>[note,...p]);
    toast(sendNow?t('sendNow'):t('scheduleCall'));
    reset();setShowM(false);
  };

  const triggerNow=id=>{
    setVoiceNotes(p=>p.map(n=>n.id===id?{...n,scheduledAt:new Date()}:n));
    toast(t('callSimulateNow'));
  };
  const delNote=id=>setVoiceNotes(p=>p.filter(n=>n.id!==id));

  return(
    <div className="page-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontSize:12.5,color:'var(--tx3)',maxWidth:520,lineHeight:1.6}}>
          Record or type a voice instruction for a patient (medicine reminders, follow-up notes). It plays back as an AI voice message in the patient's own language, and simulates an automatic care call in their portal at the scheduled time.
        </div>
        <button className="btn bp" onClick={()=>setShowM(true)}><Icon n="mic" s={13}/>{t('newInstruction')}</button>
      </div>

      {voiceNotes.length===0?
        <div style={{textAlign:'center',padding:'20px 0',color:'var(--tx3)',fontSize:13}}>{t('noInstructionsYet')}</div>:
        voiceNotes.map(n=>{
          const isSeed=typeof n.text==='object';
          const spokenLang=isSeed?lang:(n.lang||lang);
          return(
          <div className="vc-note" key={n.id}>
            <div className="vc-note-top">
              <div>
                <div className="vc-note-who">{n.patName} <span style={{color:'var(--tx3)',fontWeight:500}}>· {n.doctor}</span></div>
                <div className="vc-note-meta">{LANGS.find(l=>l.code===spokenLang)?.label} · {new Date(n.scheduledAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
              </div>
              <span className={`vc-badge ${n.status}`}>{n.status==='scheduled'?t('statusScheduled'):n.status==='delivered'?t('statusDelivered'):t('statusMissed')}</span>
            </div>
            <div className="vc-note-txt">{noteText(n,lang)}</div>
            <div className="vc-note-actions">
              <button className="btn bs sm" onClick={()=>{const r=speak(noteText(n,lang),spokenLang);setVoiceWarn(r.matched===false?n.id:null);}}><Icon n="video" s={11}/>{t('play')}</button>
              {n.status==='scheduled'&&<button className="btn bs sm" onClick={()=>triggerNow(n.id)}><Icon n="phone" s={11}/>{t('callSimulateNow')}</button>}
              <button className="btn bs sm" onClick={()=>delNote(n.id)}><Icon n="trash" s={11}/></button>
            </div>
            {voiceWarn===n.id&&<div style={{marginTop:8,fontSize:11,color:'var(--amber)'}}>{NO_VOICE_MSG[lang]||NO_VOICE_MSG.en}</div>}
          </div>
          );})
      }

      {showM&&(
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
          <div className="modal">
            <div className="modal-t">{t('doctorInstructions')}</div>
            <div className="fgrp"><label className="flbl">{t('selectPatient')}</label>
              <select className="fsel" value={pid} onChange={e=>setPid(e.target.value)}>
                {patients.map(p=><option key={p.id} value={p.id}>{p.name} · {p.id}</option>)}
              </select>
            </div>
            <div className="fgrp"><label className="flbl">Language patient will hear</label>
              <select className="fsel" value={msgLang} onChange={e=>setMsgLang(e.target.value)}>
                {LANGS.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}
              </select>
              <div style={{fontSize:11,color:'var(--tx3)',marginTop:2}}>Auto-set to {patient?.name.split(' ')[0]}'s known preferred language. Write your message below in this language — it plays back exactly as typed, read aloud in this language's voice.</div>
            </div>
            <div className="fgrp"><label className="flbl">{t('messageForPatient')}</label>
              <textarea className="finp" rows={4} value={text} onChange={e=>setText(e.target.value)} placeholder="e.g. Please take your blood pressure tablet after dinner tonight."/>
            </div>
            <div className="fgrp">
              <label className="flbl">{t('recordAudio')}</label>
              {!rec?
                <button className="btn bd2 sm" onClick={recording?stopRec:startRec}><Icon n="mic" s={12}/>{recording?t('stopRecording'):t('recordAudio')}</button>:
                <div style={{display:'flex',alignItems:'center',gap:8}}><audio controls src={rec.url} style={{height:32}}/><button className="btn bs sm" onClick={()=>setRec(null)}><Icon n="trash" s={11}/></button></div>
              }
            </div>
            <div className="fgrp"><label className="flbl">{t('scheduleDateTime')}</label>
              <input className="finp" type="datetime-local" value={when} onChange={e=>setWhen(e.target.value)}/>
            </div>
            <div className="modal-a">
              <button className="btn bs" onClick={()=>setShowM(false)}>{t('cancel')}</button>
              <button className="btn bs" onClick={()=>submit(true)} disabled={!text.trim()}>{t('sendNow')}</button>
              <button className="btn bp" onClick={()=>submit(false)} disabled={!text.trim()||!when}>{t('scheduleCall')}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

        <div className="card"><div className="card-h"><span className="card-t">{t('chronicConditions')}</span></div><div className="card-b" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {(user.chronic&&user.chronic.length?user.chronic:[t('noneRecorded')]).map(a=><span key={a} className="chip" style={{background:'var(--amberl)',color:'var(--amber)'}}>{a}</span>)}
        </div></div>
      </div>
      <div className="card"><div className="card-h"><span className="card-t">{t('longitudinalRecord')}</span></div>
        <div className="card-b">
          {timeline.length===0?(
            <div style={{textAlign:'center',padding:'20px 0',color:'var(--tx3)',fontSize:13}}>{t('noRecordsYet')}</div>
          ):(
            <div className="tl">
              {timeline.map((e,i)=>(
                <div key={e.id} className="tl-item">
                  {i<timeline.length-1&&<div className="tl-line"/>}
                  <div className="tl-dot" style={{background:tlColor[e.type]}}/>
                  <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:13,color:'var(--tx)'}}>{e.label}</div>
                      <div style={{fontSize:12,color:'var(--tx3)',marginTop:2}}>{e.detail}</div>
                    </div>
                    <div style={{fontSize:11,color:'var(--tx3)',fontFamily:'JetBrains Mono',whiteSpace:'nowrap'}}>{fmtDate(e.date)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PatientBook({user,myAppts,setMyAppts,payments,setPayments,toast,onDone}){
  const {lang,t}=useLang();
  const [step,setStep]=useState(1);
  const [selHosp,setSelHosp]=useState(null);
  const [selDoc,setSelDoc]=useState(null);
  const [selDate,setSelDate]=useState('');
  const [selSlot,setSelSlot]=useState('');
  const [reason,setReason]=useState('');
  const [deptF,setDeptF]=useState('All');
  const [hospSearch,setHospSearch]=useState('');
  const [method,setMethod]=useState('upi');
  const [paying,setPaying]=useState(false);

  const filteredHosps=CHENNAI_HOSPITALS.filter(h=>h.name.toLowerCase().includes(hospSearch.toLowerCase())||h.location.toLowerCase().includes(hospSearch.toLowerCase()));
  const hospDocs=selHosp?selHosp.doctors:[];
  const allDepts=selHosp?['All',...new Set(hospDocs.map(d=>d.dept))]:['All'];
  const filteredDocs=deptF==='All'?hospDocs:hospDocs.filter(d=>d.dept===deptF);

  const minDate=new Date(now);minDate.setDate(minDate.getDate()+1);
  const minDateStr=minDate.toISOString().split('T')[0];

  const fee=selDoc?.fee||500;
  const advance=Math.round(fee*0.2/10)*10;
  const remaining=fee-advance;

  const payAndConfirm=()=>{
    if(!selHosp||!selDoc||!selDate||!selSlot||paying)return;
    setPaying(true);
    const apptId='APT-'+(100+myAppts.length+1);
    const appt={
      id:apptId,
      pid:user.pid,
      patName:user.name,
      doctor:selDoc.name,
      dept:selDoc.dept,
      hospital:selHosp.name,
      date:selDate,
      slot:selSlot,
      status:'pending',
      reason:reason||'General consultation',
    };
    const payment={
      txnId:genTxnId(),
      pid:user.pid,
      aptId:apptId,
      fee,advance,
      method:method.toUpperCase(),
      status:'Paid',
      date:now.toISOString().split('T')[0],
    };
    setTimeout(()=>{
      setMyAppts(p=>[...p,appt]);
      setPayments(p=>[...p,payment]);
      toast(`Payment of ₹${advance} received — appointment booked!`);
      onDone();
    },900);
  };

  // Step indicator
  const steps=[{n:1,l:t('stepChooseHospital')},{n:2,l:t('stepChooseDoctor')},{n:3,l:t('stepDateSlot')},{n:4,l:t('stepReview')},{n:5,l:t('stepPayment')}];

  return(
    <div className="content">
      {/* Step indicator */}
      <div className="step-ind">
        {steps.map((s,i)=>(
          <React.Fragment key={s.n}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div className="step-dot" style={{background:step>=s.n?'var(--teal)':'var(--sf2)',border:`2px solid ${step>=s.n?'var(--teal)':'var(--bd2)'}`,color:step>=s.n?'#fff':'var(--tx3)'}}>{s.n}</div>
              <span className="step-lbl" style={{color:step===s.n?'var(--tx)':step>s.n?'var(--teal)':'var(--tx3)'}}>{s.l}</span>
            </div>
            {i<steps.length-1&&<div className="step-line" style={{background:step>s.n?'var(--teal)':'var(--bd)'}}/>}
          </React.Fragment>
        ))}
      </div>

      {step===1&&(
        <>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            <div className="fgrp" style={{maxWidth:360,marginBottom:0,flex:1}}>
              <input className="finp" placeholder={`🔍  ${t('searchHospitalBook')}`} value={hospSearch} onChange={e=>setHospSearch(e.target.value)}/>
            </div>
            <button className="btn bd2 sm" onClick={()=>{const f=fastestHospital();setSelHosp(f);setSelDoc(null);setDeptF('All');}}>⚡ {t('recommendFastest')}</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
            {filteredHosps.map(h=>(
              <div key={h.id} className={`doc-card hosp-card ${selHosp?.id===h.id?'picked':''}`} onClick={()=>{setSelHosp(h);setSelDoc(null);setDeptF('All');}}>
                <div style={{display:'flex',gap:13,alignItems:'flex-start'}}>
                  <div style={{width:46,height:46,borderRadius:12,background:`${h.clr}18`,border:`1.5px solid ${h.clr}30`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{h.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:'Fraunces',serif:true,fontWeight:700,fontSize:15,color:'var(--tx)'}}>{hName(h,lang)}</div>
                    <div style={{fontSize:12,color:'var(--tx3)',marginTop:2}}>{hLoc(h,lang)}</div>
                    <div style={{display:'flex',alignItems:'center',gap:4,marginTop:7}}>
                      <Icon n="star" s={12}/><span style={{fontSize:12,fontWeight:700,color:'var(--amber)'}}>{h.rating}</span>
                      <span style={{fontSize:12,color:'var(--tx3)',marginLeft:8}}>{h.doctors.length} {t('doctors')}</span>

                  {selHosp?.id===h.id&&(

            <div className="card-b" style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px'}}>

              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:'var(--tx)'}}>{hName(selHosp,lang)}</div><div style={{fontSize:11,color:'var(--tx3)'}}>{hLoc(selHosp,lang)}</div></div>
              <button className="btn bs sm" onClick={()=>setStep(1)}>{t('changeHospital')}</button>

          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
            {filteredDocs.map(doc=>(
              <div key={doc.id} className={`doc-card ${selDoc?.id===doc.id?'picked':''}`} onClick={()=>setSelDoc(doc)}>
                <div style={{display:'flex',gap:13,alignItems:'flex-start'}}>
                  <div className="dava" style={{background:doc.clr,width:46,height:46,borderRadius:'50%',fontSize:14}}>{initials(doc.name.replace('Dr. ',''))}</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:'Fraunces',serif:true,fontWeight:700,fontSize:15,color:'var(--tx)'}}>{dName(doc,lang)}</div>
                    <div style={{fontSize:12,color:'var(--tx3)',marginTop:2}}>{L(doc.dept,DEPT_TR,lang)} · {doc.qual}</div>
                    <div style={{fontSize:12,color:'var(--tx3)'}}>{doc.exp}</div>
                    <div style={{display:'flex',alignItems:'center',gap:4,marginTop:7}}>
                      <Icon n="star" s={12}/><span style={{fontSize:12,fontWeight:700,color:'var(--amber)'}}>{doc.rating}</span>
                      <span style={{fontSize:12,color:'var(--tx3)',marginLeft:8}}>{doc.slots.length}</span>
                    </div>
                  </div>
                  {selDoc?.id===doc.id&&(

                  )}
                </div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <button className="btn bt2" disabled={!selDoc} style={{opacity:selDoc?1:.4}} onClick={()=>setStep(3)}>{t('nextPickSlot')}</button>
          </div>
        </>
      )}

      {step===3&&selDoc&&(
        <div className="card">
          <div className="card-h">
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div className="dava" style={{background:selDoc.clr,width:38,height:38,borderRadius:'50%',fontSize:12}}>{initials(selDoc.name.replace('Dr. ',''))}</div>
              <div><div style={{fontWeight:700,fontSize:14,color:'var(--tx)'}}>{dName(selDoc,lang)}</div><div style={{fontSize:12,color:'var(--tx3)'}}>{L(selDoc.dept,DEPT_TR,lang)} · {hName(selHosp,lang)}</div></div>
            </div>
            <button className="btn bs sm" onClick={()=>setStep(2)}>{t('changeDoctor')}</button>
          </div>
          <div className="card-b">
            <div className="fgrp" style={{maxWidth:270,marginBottom:20}}>
              <label className="flbl">{t('selectDate')}</label>
              <input className="finp" type="date" value={selDate} min={minDateStr} onChange={e=>{setSelDate(e.target.value);setSelSlot('');}}/>
            </div>
            {selDate&&(
              <>
                <div style={{fontSize:13,fontWeight:600,color:'var(--tx2)',marginBottom:10}}>{t('availableSlotsOn')} {fmtDate(selDate)}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20}}>
                  {selDoc.slots.map(s=><button key={s} className={`slotbtn ${selSlot===s?'on':''}`} onClick={()=>setSelSlot(s)}>{s}</button>)}

              </>
            )}
            <div className="fgrp" style={{maxWidth:400}}>
              <label className="flbl">{t('reasonVisit')}</label>
              <input className="finp" value={reason} onChange={e=>setReason(e.target.value)} placeholder={t('reasonPh')}/>
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn bs" onClick={()=>setStep(2)}>{t('back')}</button>
              <button className="btn bt2" disabled={!selDate||!selSlot} style={{opacity:selDate&&selSlot?1:.4}} onClick={()=>setStep(4)}>{t('reviewBooking')}</button>

function PatientMyAppts({myAppts,setMyAppts,toast,goTo}){
  const {lang,t}=useLang();
  const cancelAppt=id=>{setMyAppts(p=>p.map(a=>a.id===id?{...a,status:'cancelled'}:a));toast('Appointment cancelled');};

  if(myAppts.length===0) return(
    <div className="content">
      <div className="card" style={{padding:'48px',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:14}}>📅</div>

        <div key={a.id} className="card">
          <div className="card-b" style={{padding:'16px 18px'}}>
            <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
              <div style={{width:4,borderRadius:4,background:a.status==='confirmed'?'var(--green)':a.status==='pending'?'var(--amber)':'var(--red)',alignSelf:'stretch',flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
                  <div>
                    <div style={{fontFamily:'Fraunces',serif:true,fontWeight:700,fontSize:16,color:'var(--tx)'}}>{a.doctor}</div>
                    <div style={{fontSize:13,color:'var(--tx3)',marginTop:2}}>{L(a.dept,DEPT_TR,lang)}</div>
                  </div>
                  <span className={`bdg ${a.status==='confirmed'?'bg':a.status==='pending'?'ba':'br'}`}>{t(a.status)}</span>
                </div>
                <div style={{display:'flex',gap:20,marginTop:12,flexWrap:'wrap'}}>
                  {[[t('date'),fmtDate(a.date)],[t('time'),a.slot],[t('reason'),a.reason],[t('bookingId'),a.id]].map(([l,v])=>(
                    <div key={l}>
                      <div style={{fontSize:10,color:'var(--tx3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em'}}>{l}</div>
                      <div style={{fontSize:12,fontFamily:l===t('time')||l===t('bookingId')?'JetBrains Mono':'Plus Jakarta Sans',fontWeight:500,color:'var(--tx)',marginTop:2}}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>
              {a.status!=='cancelled'&&(
                <button className="btn bd2 sm" style={{flexShrink:0}} onClick={()=>cancelAppt(a.id)}>{t('cancel_')}</button>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// PATIENT · INCOMING CARE CALL  (simulated automatic call — new, additive)
// Real outbound phone calls need a telephony backend (e.g. Twilio); inside
// this front-end-only app we simulate the call in-browser: while the patient
// portal is open, scheduled voice notes "ring" and can be answered, and the
// message is spoken aloud (or the doctor's recorded audio is played).
// ════════════════════════════════════════════════════════════════════════════
function IncomingCallModal({note,onClose,markDelivered,markMissed}){
  const {lang,t}=useLang();
  const [stage,setStage]=useState('ringing'); // ringing | playing | ended
  const [noVoice,setNoVoice]=useState(false);
  const msg=noteText(note,lang);
  const spokenLang=typeof note.text==='object'?lang:(note.lang||lang);
  const answer=()=>{
    setStage('playing');
    if(note.audio){const a=new Audio(note.audio);a.onended=()=>setStage('ended');a.play();}
    else{const r=speak(msg,spokenLang);setNoVoice(r.matched===false);setTimeout(()=>setStage('ended'),Math.min(12000,3500+msg.length*70));}
    markDelivered(note.id);
  };
  const decline=()=>{markMissed(note.id);onClose();};
  return(
    <div className="cc-overlay">
      <div className="cc-top">
        <div className="cc-avatar"><Icon n="bot" s={44}/></div>
        <div className="cc-title">{t('incomingCallTitle')}</div>
        <div className="cc-sub">{t('incomingCallSub')} · {note.doctor}</div>
        {stage==='ringing'&&<div className="cc-status">{t('incomingCallTitle')}…</div>}
        {stage==='playing'&&<><div className="cc-status">{t('playing')}</div><div className="cc-msgbox">{msg}</div></>}
        {stage==='ended'&&<><div className="cc-status">{t('callDelivered')}</div><div className="cc-msgbox">{msg}</div></>}
        {noVoice&&stage!=='ringing'&&<div style={{marginTop:10,fontSize:11.5,color:'#ffd699',maxWidth:300}}>{NO_VOICE_MSG[lang]||NO_VOICE_MSG.en}</div>}
      </div>
      {stage==='ringing'?
        <div className="cc-actions">
          <div><button className="cc-btn cc-btn-dec" onClick={decline}><Icon n="x" s={22}/></button><div className="cc-btnlbl">{t('declineCall')}</div></div>
          <div><button className="cc-btn cc-btn-ans" onClick={answer}><Icon n="phone" s={22}/></button><div className="cc-btnlbl">{t('answerCall')}</div></div>
        </div>:
        <button className="cc-btn cc-btn-end" onClick={onClose}><Icon n="x" s={20}/></button>
      }
    </div>
  );
}
function VoiceCallWatcher({user,voiceNotes,setVoiceNotes}){
  const [active,setActive]=useState(null);
  useEffect(()=>{
    const iv=setInterval(()=>{
      if(active)return;
      const due=voiceNotes.find(n=>n.pid===user.pid&&n.status==='scheduled'&&new Date(n.scheduledAt)<=new Date());
      if(due)setActive(due);
    },2000);
    return()=>clearInterval(iv);
  },[voiceNotes,active,user.pid]);
  const markDelivered=id=>setVoiceNotes(p=>p.map(n=>n.id===id?{...n,status:'delivered'}:n));
  const markMissed=id=>setVoiceNotes(p=>p.map(n=>n.id===id?{...n,status:'missed'}:n));
  if(!active)return null;
  return <IncomingCallModal note={active} onClose={()=>setActive(null)} markDelivered={markDelivered} markMissed={markMissed}/>;
}

// ════════════════════════════════════════════════════════════════════════════
// PATIENT · AI VOICE ASSISTANT  (new — floating widget, additive only)
// Rule-based (keyword-matched) FAQ + per-page read-aloud guide, spoken in the
// patient's chosen language via the browser's built-in speech synthesis, so
// it keeps working with very limited data/connectivity — no live model call.
// ════════════════════════════════════════════════════════════════════════════
const GUIDE_SECTIONS=[
  {id:'healthid',label:'healthId'},{id:'hospitals',label:'hospitals'},{id:'book',label:'book'},
  {id:'myappts',label:'myAppts'},{id:'telemed',label:'telemedicine'},{id:'diagnostics',label:'diagnostics'},
  {id:'referrals',label:'referrals'},{id:'payments',label:'payments'},{id:'reminders',label:'careReminders'},
];
function AIAssistantModal({onClose}){
  const {lang,t}=useLang();
  const [tab,setTab]=useState('ask');
  const [listening,setListening]=useState(false);
  const [typed,setTyped]=useState('');
  const [answer,setAnswer]=useState(null);
  const [noVoice,setNoVoice]=useState(false);
  const recRef=useRef(null);
  const micSupported=typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition);

  const ask=query=>{
    const hit=matchFaq(query,lang);
    const a=hit?(hit.a[lang]||hit.a.en):(NO_MATCH_MSG[lang]||NO_MATCH_MSG.en);
    setAnswer(a);
    const r=speak(a,lang);
    setNoVoice(r.matched===false);
  };
  const startListen=()=>{
    if(!micSupported){setAnswer(t('micNotSupported'));return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const r=new SR();
    r.lang=TTS_LANG_MAP[lang]||'en-IN';
    r.onstart=()=>setListening(true);
    r.onend=()=>setListening(false);
    r.onresult=e=>{const said=e.results[0][0].transcript;setTyped(said);ask(said);};
    r.onerror=()=>setListening(false);
    recRef.current=r;
    r.start();
  };
  const stopListen=()=>{recRef.current&&recRef.current.stop();setListening(false);};

  return(
    <div className="va-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="va-modal">
        <div className="va-head">
          <div className="va-head-title"><div className="va-head-ico"><Icon n="bot" s={16}/></div>{t('aiAssistant')}</div>
          <button className="va-close" onClick={onClose}><Icon n="x" s={13}/></button>
        </div>
        <div className="va-tabs">
          <button className={`va-tab ${tab==='ask'?'on':''}`} onClick={()=>setTab('ask')}>{t('askTab')}</button>
          <button className={`va-tab ${tab==='guide'?'on':''}`} onClick={()=>setTab('guide')}>{t('guideTab')}</button>
        </div>
        <div className="va-body">
          {tab==='ask'?(
            <>
              <div className="va-intro">{t('assistantIntro')}</div>
              <div className="va-mic-wrap">
                <button className={`va-mic-btn ${listening?'on':''}`} onClick={listening?stopListen:startListen}><Icon n="mic" s={26}/></button>
                <div className="va-mic-lbl">{listening?t('listening'):t('tapMicToSpeak')}</div>
              </div>
              <div className="va-typerow">
                <input value={typed} onChange={e=>setTyped(e.target.value)} placeholder={t('typeYourQuestion')} onKeyDown={e=>e.key==='Enter'&&typed.trim()&&ask(typed)}/>
                <button className="btn bp sm" onClick={()=>typed.trim()&&ask(typed)}>{t('send')}</button>
              </div>
              <div className="va-faq-list">
                {ASSISTANT_FAQ.slice(0,5).map(f=>(
                  <button key={f.id} className="va-faq-btn" onClick={()=>ask((f.keywords[lang]||f.keywords.en)[0])}>
                    {f.a[lang]?.slice(0,44)||f.a.en.slice(0,44)}… <Icon n="video" s={12}/>
                  </button>
                ))}
              </div>
              {answer&&<div className="va-answer">{answer}<div><button className="va-repeat" onClick={()=>{const r=speak(answer,lang);setNoVoice(r.matched===false);}}>{t('repeatBtn')}</button></div>
                {noVoice&&<div style={{marginTop:8,fontSize:11.5,color:'var(--amber)'}}>{NO_VOICE_MSG[lang]||NO_VOICE_MSG.en}</div>}
              </div>}
            </>
          ):(
            <div>
              {GUIDE_SECTIONS.map(g=>{
                const f=ASSISTANT_FAQ.find(x=>x.a[lang]&&x.id===g.id)||ASSISTANT_FAQ.find(x=>x.id===g.id);
                const txt=f?(f.a[lang]||f.a.en):'';
                return(
                  <div className="va-guide-item" key={g.id}>
                    <div className="va-guide-txt"><div className="va-guide-name">{t(g.label)}</div>{txt}</div>
                    <button className="va-play-btn" onClick={()=>{const r=speak(txt,lang);setNoVoice(r.matched===false);}}><Icon n="video" s={14}/></button>
                  </div>
                );
              })}
              {noVoice&&<div style={{marginTop:6,fontSize:11.5,color:'var(--amber)'}}>{NO_VOICE_MSG[lang]||NO_VOICE_MSG.en}</div>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
function AIAssistantFab(){
  const [open,setOpen]=useState(false);
  return(<>
    <button className="fab-ai" onClick={()=>setOpen(true)} title="AI Assistant"><Icon n="bot" s={22}/></button>
    {open&&<AIAssistantModal onClose={()=>setOpen(false)}/>}
  </>);
}

// ROOT
// ════════════════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════════════════
// LANGUAGE GATE — shown once right after login, full-screen and large-tap-target
// so people with low literacy or unfamiliar with English can pick their own
// language immediately, instead of hunting for a small dropdown later.
// ════════════════════════════════════════════════════════════════════════════
const LANG_SELF_NAME={en:'English',hi:'हिन्दी',mr:'मराठी',ta:'தமிழ்',te:'తెలుగు'};
function LanguageGate({onDone}){
  const {setLang}=useLang();
  const choose=code=>{setLang(code);onDone();};
  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'linear-gradient(160deg,#faf3ea 0%,#f6e9db 55%,#f3ded1 100%)',padding:'32px 20px'}}>
      <div style={{width:58,height:58,borderRadius:18,background:'linear-gradient(135deg,var(--teal),#037a62)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:24,boxShadow:'0 10px 26px rgba(5,145,120,.28)'}}>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L12 22M2 12h20" stroke="white" strokeWidth="2.5" strokeLinecap="round"/><circle cx="12" cy="12" r="5" stroke="white" strokeWidth="2"/></svg>
      </div>
      <div style={{fontFamily:'Fraunces,serif',fontSize:27,fontWeight:700,color:'var(--tx)',textAlign:'center',marginBottom:8,letterSpacing:'-.3px'}}>Choose your language</div>
      <div style={{fontSize:15,color:'var(--tx2)',textAlign:'center',marginBottom:36,maxWidth:460,lineHeight:1.8}}>अपनी भाषा चुनें · तुमची भाषा निवडा<br/>உங்கள் மொழியைத் தேர்ந்தெடுக்கவும் · మీ భాషను ఎంచుకోండి</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:14,width:'100%',maxWidth:660}}>
        {LANGS.map(l=>(
          <button key={l.code} onClick={()=>choose(l.code)} className="lang-gate-card">
            <span style={{fontSize:26,fontWeight:700,color:'var(--tx)'}}>{l.label}</span>
            <span style={{fontSize:11,color:'var(--tx3)',marginTop:6}}>{LANG_SELF_NAME[l.code]}</span>
          </button>
        ))}
      </div>
      <div style={{fontSize:12,color:'var(--tx3)',marginTop:30}}>You can change this anytime from the top of the app.</div>
    </div>
  );
}

function App(){
  const [auth,setAuth]=useState(null);
  const [langChosen,setLangChosen]=useState(false);
  const [voiceNotes,setVoiceNotes]=useState(INIT_VOICE_NOTES);
  const logout=()=>{setAuth(null);};
  return (
    <LangProvider>
      {!langChosen
        ? <LanguageGate onDone={()=>setLangChosen(true)}/>
        : !auth
          ? <LoginPage onLogin={(role,user)=>setAuth({role,user})}/>
          : auth.role==='admin'
            ? <AdminPortal user={auth.user} onLogout={logout} voiceNotes={voiceNotes} setVoiceNotes={setVoiceNotes}/>
            : <PatientPortal user={auth.user} onLogout={logout} voiceNotes={voiceNotes} setVoiceNotes={setVoiceNotes}/>}
    </LangProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
